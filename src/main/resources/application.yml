server:
  port: 8080

spring:
  application:
    name: LifeViews
  datasource:
    url: jdbc:mysql://localhost:3306/lifeviews?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: LifeViewsJwtSecretKeyForJava17SpringBoot3MyBatisPlus
  expiration: 86400000
